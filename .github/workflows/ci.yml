name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs: one group per PR, so a new push cancels the superseded run. Pushes to main: one group
  # per commit (GitHub would otherwise replace a still-pending run in the same group), so every
  # merged commit gets its own full result.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # src/lib/api/schema.ts is generated from vertice-bff's docs/openapi.json at the commit
      # pinned in src/lib/api/.bff-ref. Fails when the committed file is stale (run
      # `npm run api:types` and commit the result). Fetches a public raw.githubusercontent URL.
      - name: Generated API types are up to date
        run: npm run api:types -- --check
      # src/theme/tokens.ts must equal vertice-web-react's globals.css tokens at the commit pinned
      # in src/theme/.web-ref (see scripts/check-tokens.mts).
      - name: Design tokens match the web
        run: npm run tokens:check
      # Typed routes (.expo/types, git-ignored) so the typecheck also checks every href.
      - name: Generate typed routes
        run: npm run routes:types
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm test -- --ci
      # The date modules again, one zone ahead of UTC and one behind: nothing may depend on the
      # host's zone (src/lib/format.ts explains why both are needed).
      - run: npm run test:hostile-tz
      # Fails on Expo SDK version drift (run `npx expo install --fix` to realign). This compares
      # the installed packages against the versions the installed Expo SDK expects, which is the
      # signal the old blocking `npx expo-doctor` step was here for, without depending on the
      # remotely fetched Expo config schema (see the advisory step below).
      - name: Expo SDK version drift
        run: npx expo install --check
      # Blocking again: the one check it failed (`ios.icon` pointing at an Icon Composer `.icon`
      # directory) went away with the app's own icons (spec PR 14).
      - name: Expo doctor
        run: npx expo-doctor
      - name: Audit production dependencies
        # TODO(P2-05): make this blocking. Today it reports high/critical transitive advisories
        # in Expo/Metro tooling (braces, node-forge, shell-quote, source-map-js) that need an
        # SDK-level upgrade or overrides, which P2-05 handles. Non-blocking until then so the
        # report stays visible in every run without failing unrelated PRs.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
